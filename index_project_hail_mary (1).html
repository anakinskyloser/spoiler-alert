                content: `
                    <p class="lead text-lg text-white font-serif">Before the serum, Steve Rogers was a skinny kid who kept showing up. That is habit one: consistency beats raw talent every single day.</p>
                    <p>When we analyze <em>Captain America: The First Avenger</em>, we often focus on the miraculous physical transformation inside Dr. Erskine’s chamber. But cinema tricks us into believing in instant breakthroughs. The true power of Steve Rogers was forged long before the lab in Brooklyn—it was built in the grueling daily discipline of refusing to stay down, even when outmatched and exhausted.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">1. The Habit of Showing Up (No Matter Your Size)</h3>
                    <p>Rogers attempted to enlist five separate times in five different cities. He forged documents, hid medical conditions, and endured humiliating rejections for asthma, heart murmurs, and small stature. Yet he kept lining up in recruitment offices. Healthy physical and mental habits operate on the exact same mechanics: showing up to the gym, the desk, or the kitchen counter even when your present capabilities feel hopelessly inadequate.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">2. Diving on the Grenade (Micro-Sacrifices)</h3>
                    <p>During basic training at Camp Lehigh, Colonel Phillips throws a dummy grenade to test the recruits. While the physically elite soldiers dive for cover, Rogers throws his frail body directly onto the explosive to save everyone else. Real health transformation requires diving on micro-grenades daily: sacrificing cheap dopamine, stepping away from late-night screens, and embracing short-term discomfort for long-term protection.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">3. The Flagpole Strategy (Work Smarter, Not Harder)</h3>
                    <p>When challenged to retrieve a flag from a high pole for a ride home, recruits spent energy scrambling up the slippery metal. Steve simply pulled the pin at the base, let the heavy pole drop, and picked up the flag off the ground. Small, intelligent adjustments in your environment—like prepping meals on Sunday or placing your running shoes by the bed—yield massive habit momentum without wasted effort.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">4. Build Your Howling Commandos (Accountability Systems)</h3>
                    <p>Cap never fought Hydra alone; he assembled a specialized squad of trusted allies like Bucky Barnes, Gabe Jones, and Dum Dum Dugan. Habits do not survive in isolation. Surrounding yourself with peers who normalize discipline makes health an identity rather than a grueling chore.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">5. "I Can Do This All Day" (Pacing & Longevity)</h3>
                    <p>Steve’s catchphrase isn't about arrogance; it’s an ethos of steady endurance. Avoid burnout by adopting sustainable micro-habits that you can realistically maintain for the next decade. Real victory lies in continuous, unbroken streak building.</p>

                    <p class="lead text-lg text-white font-serif">You dropped $150,000 on an education you could have got for $1.50 in late fees at the public library. Will Hunting understood information access—but true retention requires vulnerability.</p>
                    <p>In <em>Good Will Hunting</em>, Matt Damon plays a janitor at MIT who can solve graduate-level Fourier transforms on a hallway chalkboard in minutes. Yet despite reading thousands of books, Will is emotionally trapped and incapable of applying knowledge to his own life choices. His journey provides the ultimate framework for how we absorb, retain, and synthesize knowledge in the digital age.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">1. Active Retrieval vs. Passive Consumption</h3>
                    <p>Will doesn't just read books; he deconstructs them, argues with them, and tests them against reality. Modern cognitive psychology highlights that re-reading notes or highlighting textbooks creates a false illusion of competence. True retention demands active recall—testing your memory without looking at the text and forcing your brain to reconstruct neural pathways.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">2. The "Feynman Technique" in a Boston Bar</h3>
                    <p>During the famous bar debate with an arrogant graduate student, Will quotes 50 years of economic history from memory to dismantle a regurgitated argument. He understands the core concepts so thoroughly that he can reframe them effortlessly. If you cannot explain a complex topic in simple terms to a friend, you haven't retained it yet; you've merely memorized words.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">3. Experiential Anchoring (The Park Bench Monologue)</h3>
                    <p>Robin Williams' character, Dr. Sean Maguire, delivers a masterclass on the limits of book smarts: <em>"If I ask you about art, you'd probably give me the skinny on every art book ever written... but I bet you can't tell me what it smells like in the Sistine Chapel."</em> Connect abstract concepts to emotional, real-world experiences to lock them into long-term memory banks.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">4. Breaking Through Cognitive Defense Mechanisms</h3>
                    <p>Will used obscure intellectual facts as armor to keep people at a distance. When studying complex subjects, we often collect bookmarks and saved articles to feel productive without doing the hard work of deep comprehension. True learning happens when you drop the armor and wrestle directly with difficult ideas.</p>
                    <p>Another useful part of Will's story is the difference between being able to answer a question and being able to use what you know. A person may remember definitions perfectly but still struggle to recognize when an idea applies outside a classroom. To close that gap, try connecting every new concept to a concrete example. After reading a chapter, describe where the idea might appear in daily life, explain why it matters, and identify a situation in which it might not apply. This turns learning into a process of interpretation rather than a race to collect facts.</p>
                    <p>Will also reminds us that intelligence is not the same as emotional maturity. His talent gives him opportunities, but it cannot make difficult decisions for him or automatically repair his relationships. In the same way, academic achievement does not remove the need for patience, curiosity, and honest self-reflection. A strong learner should be willing to say, “I do not understand this yet,” and ask for help without treating that admission as failure. Mentors, classmates, teachers, and friends can challenge our assumptions in ways that solitary reading cannot.</p>
                    <p>A practical routine inspired by the film could be simple: study a small section, close the material, write down what you remember, and explain the main idea in your own words. Return to it later and test yourself again. When an answer is incomplete, use the gap to decide what to review next. The goal is not to imitate Will's extraordinary memory. It is to become more thoughtful about what you learn, how you apply it, and how willing you are to let new experiences change your understanding.</p>

                content: `
                    <p class="lead text-lg text-white font-serif">Director's Notes: Translating symmetrical cinema to campus life.</p>
                    <p>Instead of standard handheld vlog cuts, this 90-second visual essay captures a regular Bruneian student's life at KIGS Brunei by turning daily routines at Kolej IGS into an exercise in rigid symmetry, flat grid layouts, and snappy camera work. The goal was simple: take the mundane rhythm of college life (arriving at campus, taking notes, reading in the library) and frame it through the whimsical, meticulously structured lens of Wes Anderson.</p>
                    <p>Filmed entirely on an iPhone 13 using Cinematic Mode at 24fps, the project relies on dead-center framing, pastel color-matching around Kiulap, and sharp 90-degree whip-pans to replace traditional narrative pacing.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">1. Dead-Center Framing & Planar Composition</h3>
                    <p>In classical vlogging, movement creates energy. In Wes Anderson's visual universe, stillness within symmetry creates humor and elegance. Every shot at KIGS was staged with strict grid alignments: the subject sitting exactly in the center of the lecture desk, symmetrical bookshelves bracketing the library shot, and door frames matching the geometric grid of campus architecture.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">2. Color Palettes of Kiulap & Campus Spaces</h3>
                    <p>To match Anderson’s iconic pastel aesthetic (think <em>The Grand Budapest Hotel</em> or <em>Moonrise Kingdom</em>), we color-graded the footage to emphasize warm, muted pastels—soft mint greens, pale mustard yellows, and warm coral pinks. This turns ordinary college hallways into stylized theatrical sets.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">3. The Rhythmic Whip-Pan</h3>

                    <p>Ultimately, framing student life this way transforms routine into art. It forces you to look at everyday surroundings—the desk, the hallway, the morning walk—with fresh appreciation for detail and structure.</p>

                content: `
                    <p class="lead text-lg text-white font-serif">WALL-E spent 700 years compacting garbage on an abandoned Earth, while humans hovered in floating chairs sipping meals through straws. Pixar didn't just warn us about trash—they predicted digital paralysis.</p>
                    <p>Andrew Stanton’s masterpiece <em>WALL-E</em> remains one of cinema's sharpest critiques of consumerism and environmental neglect. But beneath the rusted robot romance lies a critical warning about how convenience can quietly erode our health, critical thinking, and connection to nature.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">1. Digital Paralysis & Screen Dependence</h3>
                    <p>On the Axiom spaceship, humans sit in hover-chairs with glowing holographic screens hovering inches from their faces. They don't look at the world around them, nor do they look at each other. They speak through digital headsets even when sitting side-by-side. This mirrors modern screen addiction, where notifications, algorithmic feeds, and passive content consumption pull us away from presence and real-world awareness.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">2. The Pitfall of Hyper-Convenience</h3>
                    <p>When every physical task is automated—from walking to selecting clothing colors—the Axiom passengers lose physical mobility and bone density. Convenience promised freedom, but delivered helplessness. Reclaiming personal vitality requires intentionally choosing effort: walking instead of riding, cooking real food instead of instant options, and engaging in active problem-solving.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">3. Mindful Environmental Stewardship</h3>
                    <p>WALL-E's careful preservation of tiny artifacts—a plant in a boot, a cassette tape, a Rubik's cube—highlights the value of taking care of what we already own. Overconsumption stems from replacing things the moment novelty fades. True sustainability begins with intentionality in daily consumption habits.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">4. "I Don't Want to Survive, I Want to Live!"</h3>
                    <p>When Captain McCrea realizes what humanity has given up, he utters the core message of the movie: survival is passive, but living requires active presence, effort, and connection to the soil. Breaking out of autopilot mode is the first step toward genuine personal growth.</p>
                `,

                content: `
                    <p class="lead text-lg text-white font-serif">Jarhead is a war movie in which almost nothing happens, and that is exactly why it is such a sharp film about autonomy. It asks who gets to decide what you do, what you feel, and what your story means.</p>
                    <p>Based on Anthony Swofford’s memoir of the Gulf War, Sam Mendes' <em>Jarhead</em> strips away heroic mythologies. It follows Marines who spend months training, sweating in desert heat, and waiting for a combat mission that is cancelled at the final second by air strikes.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">1. The Illusion of Purpose Given by Institutions</h3>
                    <p>Swofford enlists without a grand ideology—he joins because he doesn't know what else to do with his life. The military gives him structure, orders, and a defined goal (taking a sniper shot). But when institutionally manufactured purpose is stripped away, he is left confronting the void of his own identity.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">2. The Frustration of Unspent Effort</h3>
                    <p>After years of relentless physical conditioning and target practice, Swofford is ordered to hold his fire just as he lines up his crosshairs. This psychological climax shows how painful it is to dedicate energy toward an objective, only to realize external systems determine whether your effort was meaningful.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">3. Reclaiming Agency over Your Narrative</h3>
                    <p>When the war ends, the soldiers return to civilian life where no one gives orders. The film’s closing reflection emphasizes that true maturity begins when you stop waiting for external authority to direct your life and take full ownership of your decisions and identity.</p>
                `,

                spoiler: "Your coping mechanisms and your mental health struggles don't mean you are broken, immature, or crazy. They mean you are navigating an environment that hasn't made space for your full self. You do not need to change your core or quiet your pain to deserve to be heard.",
                content: `
                    <p class="lead text-lg text-white font-serif">Ash Fox stands in his kitchen wearing a cape and tube socks, doing a spit-take to demand attention from a dinner table that barely looks up. As an eldest daughter, I recognized him instantly.</p>
                    <p>In Wes Anderson’s <em>Fantastic Mr. Fox</em>, Ash is hyper-fixated on being seen as "different" and capable. He wears a custom superhero cape to breakfast, obsessively measures his athletic height against his cousin Kristofferson, and acts out whenever he feels invisible in his own household. Cinema frames Ash as a quirky, difficult child. But beneath the stop-motion charm lies a profound psychological portrait of family roles and coping mechanisms.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">1. The Weight of Unspoken Family Expectations</h3>
                    <p>As eldest daughters, many of us grow up feeling like we carry an invisible burden—the need to excel, to protect, to manage emotions, and to earn validation through achievement. When Kristofferson arrives—naturally athletic, polite, and effortlessly praised—Ash's internal world implodes. The rivalry isn't really about Kristofferson; it's about Ash's desperate fear that his worth is conditional on being exceptional.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">2. Coping Mechanisms are Survival Tools, Not Flaws</h3>
                    <p>Ash’s aggressive spit-takes, sullen moods, and insistence on wearing his cape everywhere are easy to write off as teenage rebellion. In reality, they are defense mechanisms built to preserve his identity in a family dominated by his father’s larger-than-life shadow. We often judge our own mental health struggles or behavioral quirks harshly, forgetting that they once served as our shield to survive overwhelming environments.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">3. "Why is He Different?" / "We're All Different"</h3>
                    <p>When Ash asks why his cousin is so different, Mrs. Fox gently tells him, <em>"We're all different, especially a wild animal."</em> The turning point for Ash comes when he stops trying to copy his father or compete with Kristofferson and embraces his unique skills—his small stature allowed him to slip through the grate and retrieve the bandit hat.</p>
                    <p>Your mental health journey begins when you stop forcing yourself into molds created by family legacy or social expectation. Being the eldest daughter or the "different" one isn't a sentence to hide who you are; it's an invitation to own your story completely.</p>
                `,

                    <p class="lead text-lg text-white font-serif">What does it mean to be a person of faith when your actions do not always reflect what you believe? And can people who follow different paths still find ways to care for one another? <em>Your Mother, Your Mother, Your Mother</em> left me thinking about both questions long after the story ended.</p>
                    <p>Latif is a Muslim man who prays, visits the mosque, and finds comfort in his relationship with God. Yet he also works as a hitman, living with choices that contradict the values his faith teaches. I do not think the film asks us to reduce him to a hypocrite. Instead, it gives us a complicated person: someone grieving, struggling, and trying to find his way through circumstances that do not offer easy answers.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">1. The Comfort of Believing</h3>
                    <p>Latif's relationship with religion is personal. In moments of fear and grief, prayer gives him somewhere to turn, even when he cannot make sense of what is happening around him. Sometimes people reach for faith not because they have everything figured out, but because they do not. We pray because we are afraid, because we are hurting, or because we need to believe that there is something beyond what we can control.</p>
                    <p>That tension is what makes Latif compelling. His faith is present, but so are his mistakes. The film allows both things to exist at once without pretending that one cancels out the other.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">2. Somewhere Between Faith and Practice</h3>
                    <p>As someone who is Muslim on paper, I found myself somewhere between Latif and Hatty. There are parts of faith I recognise, parts I struggle with, and moments when I wonder whether my actions reflect the values I associate with my religion. I imagine many people, religious or otherwise, understand that feeling of being caught between what they believe and how consistently they manage to live by it.</p>
                    <p>Belief and practice do not always move at the same pace. We can believe in something and still fall short of it. But that should not become a reason to stop trying. There is a difference between seeking forgiveness and using forgiveness as permission to do wrong. Faith should encourage us to recognise our mistakes, take responsibility, and make a sincere effort to do better.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">3. The Shoes Latif Has to Fill</h3>
                    <p>Qadir's remark about the shoes Latif has to fill stayed with me. For his age, Qadir is remarkably observant. He notices more than the adults around him might assume, and his words carry an unexpected weight. Children may not always have the language to explain everything they see, but that does not mean they are unaware of what is happening around them.</p>
                    <p>Latif is not only a man trying to reconcile his beliefs with his choices; he is also a father whose children are watching and learning from him. The shoes he has to fill can be understood as the responsibilities that come with being someone else's source of protection and guidance. His children do not need him to be flawless, but they do need him to understand the weight of the example he sets. Children may not always understand the weight of the world, but that does not mean they fail to notice who is carrying it.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">4. Different Beliefs, Shared Humanity</h3>
                    <p>One of the film's most meaningful moments is when the Mormon community helps Latif and his family. They come from a different religious background, yet they offer support when it is needed. They do not need to share Latif's beliefs to recognise that his family is struggling.</p>
                    <p>To me, this is an important reminder that living together harmoniously does not mean everyone has to believe the same things. It means respecting our differences without turning them into reasons for division. We can have different religions, traditions, and ways of understanding the world while still sharing the responsibility to care for one another. We do not have to agree on everything to stand beside someone. We do not have to share a faith to share kindness.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">5. When Belief Becomes a Justification</h3>
                    <p>Pastor Hwan offers a contrast to that compassion. His religious convictions become entangled with violence and personal motives. I do not read this as the film condemning religion itself. Rather, it raises the danger of allowing personal interpretations of belief to justify actions that harm others.</p>
                    <p>It is easy to speak about goodness, morality, and righteousness. It is harder to practise them when anger, fear, or self-interest gets in the way. Religious identity alone does not determine how someone treats other people. What matters is whether our convictions lead us towards compassion and responsibility, or become a shield for the things we do wrong.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">6. Who Prayed for You?</h3>
                    <p>Fatiha's prayer for Latif is one of the film's most moving moments. For much of the story, we see Latif turning to God in his own moments of desperation. Here, the direction of that care is reversed: his daughter is the one praying for him. As Latif appears close to death, Fatiha's prayer becomes part of the moment that brings him back.</p>
                    <p>The question “Who prayed for you?” gives the scene another layer. It makes us think about the people whose love and prayers carry us when we cannot carry ourselves. Latif is not only someone seeking forgiveness; he is also a father who is loved, needed, and prayed for. Fatiha sees him as her father, and her prayer reminds us of the bonds that can call someone back towards life and responsibility.</p>
                    <p>There is also a quiet connection here to the film's wider message. Prayer may be rooted in particular beliefs, but the care behind it is something people can understand across differences. We may not pray in the same way, but we can still hope for one another, wish one another well, and ask for one another's safety.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">7. The Goodness We Leave Behind</h3>
                    <p>Ultimately, the film left me thinking about the kind of people we choose to be. I do not have every answer about faith, and I do not think everyone does. Some of us practise more consistently than others; some are still finding their way; others are carrying questions they have not yet learned how to express. That is all the more reason to approach one another with patience.</p>
                    <p>We should be able to live alongside people whose beliefs differ from ours without treating those differences as barriers. We should offer kindness without expecting someone to share our religion, and recognise goodness even when it comes from somewhere unfamiliar. We may not all walk the same path of faith, carry the same beliefs, or fill the same shoes. But while we are here, we can choose to make one another's journeys a little easier.</p>
                    <p>Perhaps we will never be perfectly faithful or perfectly good. But we can keep trying. We can pray for one another, stand beside one another, take responsibility for our actions, and above all, do good. Maybe that is one of the simplest ways to honour the faith we carry, whatever shape it takes.</p>
                    <p>Because there is a difference between seeking forgiveness and using forgiveness as permission to do wrong. And somewhere between sin and prayer, perhaps that is where the real struggle begins.</p>
                `,

                spoiler: "After discovering that Taumoeba can eliminate the Astrophage threatening both Earth and Erid, Grace manages to send samples back to Earth. But when he realises Rocky is in danger, he turns around to save his friend instead of continuing home. The film ends with Grace living on Erid and teaching science to young Eridians. Humanity is saved, but perhaps the most meaningful thing Grace gains is a friendship that makes an entire universe feel a little less lonely.",
                content: `
                    <p class="lead text-lg text-white font-serif">What does humanity look like when it is pushed to the edge of extinction? And when survival becomes the only thing that matters, how much of our humanity are we willing to sacrifice to achieve it? <em>Project Hail Mary</em> left me thinking about both questions, but also about something rather unexpected: how an alien friendship can remind us of the very best parts of being human.</p>
                    <p>At first, the film seems to be about saving the world through science. Earth is running out of time, the Sun is dimming, and Eva Stratt is tasked with finding a solution before humanity disappears. But underneath all the science-fiction spectacle is a much more personal story about fear, responsibility, trust, and the choices we make when the people around us become more than just a means to an end.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">1. The Necessary Evil: Eva Stratt and the Greater Good</h3>
                    <p>Eva Stratt is not exactly an easy person to like. She is practical, demanding, and willing to make decisions that most people would struggle to justify. When the fate of the entire planet is placed in her hands, she begins to see every person, every resource, and every decision through one question: what gives humanity the best chance of surviving?</p>
                    <p>In a way, I understand why she becomes the person she is. The situation does not leave much room for hesitation. Someone has to make the difficult calls, and someone has to be willing to carry the weight of them. Stratt's choices come from a place of necessity rather than cruelty. She is not trying to hurt people for the sake of it; she is trying to save billions.</p>
                    <p>But that is also what makes her unsettling. When the greater good becomes the only thing that matters, it becomes frighteningly easy to justify almost anything. The people caught in those decisions can start to look less like individuals and more like numbers on a page. Perhaps Stratt is a necessary evil, but the word <em>necessary</em> does not automatically make every action right.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">2. When a Person Becomes a Resource</h3>
                    <p>Grace is a scientist, not a soldier. He is frightened, reluctant, and very aware that the mission may cost him his life. Yet the circumstances around him leave him with very little say in what happens next. His intelligence makes him valuable to the mission, but being valuable is not the same as being free to choose.</p>
                    <p>That distinction matters. We often praise people for being useful, dependable, or capable of carrying difficult responsibilities. But do we remember that they are people before they are what they can contribute? There is something uncomfortable about a world that celebrates sacrifice while forgetting to ask whether the person making that sacrifice ever had a choice.</p>
                    <p>Grace's fear does not make him selfish. It makes him human. Wanting to live is not a moral failure, and being brave does not mean being unafraid. Sometimes courage begins with admitting that you are terrified and doing what you can anyway.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">3. An Alien's Perspective on Humanity</h3>
                    <p>Then Rocky enters the story, and suddenly the film becomes something much warmer. Here are two beings from completely different worlds, with different bodies, senses, languages, and ways of understanding the universe. They cannot even communicate in the usual sense at first. Yet they find a way to understand one another.</p>
                    <p>What I love about their relationship is that neither of them begins with a guarantee that the other is safe or familiar. They have to be patient. They have to learn. They make mistakes, find ways around their differences, and slowly build trust through the small things they do for each other. Their friendship is not built on being alike. It is built on being willing to meet somewhere in the middle.</p>
                    <p>Rocky also gives Grace something that the mission cannot: companionship without an agenda. He does not see Grace as a resource to be used or a problem to be solved. He sees him as someone worth helping. In the middle of an enormous scientific crisis, that simple act of recognising another person feels almost revolutionary.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">4. The Difference Between Being Needed and Being Valued</h3>
                    <p>There is a contrast between how the mission treats Grace and how Rocky comes to treat him. Stratt needs Grace because of what he knows. Rocky chooses to work with him because their lives depend on one another, but their relationship grows beyond that practical arrangement. They become friends.</p>
                    <p>Being needed can make us feel important, but being valued makes us feel seen. The two are not always the same. We can be surrounded by people who appreciate what we do and still wonder whether they would care if we had nothing left to offer. Rocky's friendship with Grace is a reminder that care should not have to be earned through usefulness.</p>
                    <p>And perhaps that is one of the film's quietest ideas: connection does not require us to understand everything about another person. It asks us to make the effort, to listen, and to recognise that their life matters as much as our own.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">5. Sacrifice Means Something Different When It Is a Choice</h3>
                    <p>The most meaningful decision Grace makes comes when he has a way home, but realises that Rocky is in danger. He turns back. It is not because someone orders him to, or because the mission calculates that it is the most efficient option. He does it because he cannot leave his friend behind.</p>
                    <p>That choice feels different from the sacrifice that was expected of him earlier. Both decisions involve risk, but one is shaped by pressure while the other comes from care. Grace finally has the chance to decide what matters to him, and he chooses another life alongside his own.</p>
                    <p>I think there is something important in that distinction. Sacrifice is often treated as proof of goodness, but sacrifice without agency can become another form of taking from someone. When we choose to show up for another person, however, it becomes an expression of love, trust, and responsibility. It means more because it is freely given.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">6. What Are We Actually Trying to Save?</h3>
                    <p>By the end, humanity has a chance to survive. The scientific answer has been found, the samples make their way back, and Grace is teaching young Eridians on a world that is no longer quite so unfamiliar. It is a hopeful ending, but not simply because the planet is saved.</p>
                    <p>Stratt's approach reminds us what humanity can become at its most desperate: efficient, determined, and willing to do almost anything to keep itself alive. Grace and Rocky show us what humanity can look like at its best: curious, compassionate, imperfect, and capable of caring for someone who is completely different from us.</p>
                    <p>Perhaps saving humanity should mean more than preserving the species. It should also mean preserving the things that make life worth living: friendship, kindness, trust, and the ability to see another being as more than a tool for our own survival. Otherwise, what exactly are we saving?</p>
                    <p>Because what is the point of saving a world if we forget how to care for the people living in it?</p>
                `,

                            <div>
                                <div class="text-[10px] uppercase text-muted">Previous</div>
                                <div class="text-white font-serif font-bold line-clamp-1">${prevEntry.filmTitle}</div>
                            </div>
                        </button>
                        
                        <button onclick="navigateToEntry('${nextEntry.id}')" class="flex items-center space-x-2 text-muted hover:text-brandBlue transition-colors group text-right">
                            <div>
                                <div class="text-[10px] uppercase text-muted">Next</div>
                                <div class="text-white font-serif font-bold line-clamp-1">${nextEntry.filmTitle}</div>
                            </div>
                            <svg class="transition-transform group-hover:translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;width:1.3em;height:1.3em;vertical-align:-0.28em" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                        </button>
                    </div>

                    <div class="pt-8 border-t border-border">
                        ${renderCinemaTicket(`entry-bottom-newsletter-${entry.id}`)}
                    </div>
                </article>
            `;
        }

        function router() {
            const app = document.getElementById('app-content');
            const hash = window.location.hash || '#home';

            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (hash === '#home' || hash === '') {
                app.innerHTML = renderHome();
            } else if (hash === '#diary') {
                app.innerHTML = renderDiary();
            } else if (hash === '#lists') {
                app.innerHTML = renderLists();
            } else if (hash === '#profile') {
                app.innerHTML = renderProfile();
            } else if (hash.startsWith('#film-')) {
                const entryId = hash.replace('#', '');
                app.innerHTML = renderFilmEntry(entryId);
            } else {
                app.innerHTML = renderHome();
            }
        }

        window.addEventListener('hashchange', router);
        window.addEventListener('load', () => {
            document.getElementById('current-year').textContent = new Date().getFullYear();
            router();
        });
    </script>
</body>
</html>
