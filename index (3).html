                spoiler: "Steve Rogers doesn't gain supernatural drive from the super-soldier serum; the serum simply amplifies the unyielding grit, integrity, and daily habit of showing up he possessed when he was a 90-pound kid from Brooklyn.",
                content: `
                    <p class="lead text-lg text-white font-serif">Before the serum, Steve Rogers was a skinny kid who kept showing up. That is habit one: consistency beats raw talent every single day.</p>
                    <p>When we analyze <em>Captain America: The First Avenger</em>, we often focus on the miraculous physical transformation inside Dr. Erskine’s chamber. But cinema tricks us into believing in instant breakthroughs. The true power of Steve Rogers was forged long before the lab in Brooklyn—it was built in the grueling daily discipline of refusing to stay down, even when outmatched and exhausted.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">1. The Habit of Showing Up (No Matter Your Size)</h3>
                    <p>Rogers attempted to enlist five separate times in five different cities. He forged documents, hid medical conditions, and endured humiliating rejections for asthma, heart murmurs, and small stature. Yet he kept lining up in recruitment offices. Healthy physical and mental habits operate on the exact same mechanics: showing up to the gym, the desk, or the kitchen counter even when your present capabilities feel hopelessly inadequate.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">2. Diving on the Grenade (Micro-Sacrifices)</h3>
                    <p>During basic training at Camp Lehigh, Colonel Phillips throws a dummy grenade to test the recruits. While the physically elite soldiers dive for cover, Rogers throws his frail body directly onto the explosive to save everyone else. Real health transformation requires diving on micro-grenades daily: sacrificing cheap dopamine, stepping away from late-night screens, and embracing short-term discomfort for long-term protection.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">3. The Flagpole Strategy (Work Smarter, Not Harder)</h3>
                    <p>When challenged to retrieve a flag from a high pole for a ride home, recruits spent energy scrambling up the slippery metal. Steve simply pulled the pin at the base, let the heavy pole drop, and picked up the flag off the ground. Small, intelligent adjustments in your environment—like prepping meals on Sunday or placing your running shoes by the bed—yield massive habit momentum without wasted effort.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">4. Build Your Howling Commandos (Accountability Systems)</h3>
                    <p>Cap never fought Hydra alone; he assembled a specialized squad of trusted allies like Bucky Barnes, Gabe Jones, and Dum Dum Dugan. Habits do not survive in isolation. Surrounding yourself with peers who normalize discipline makes health an identity rather than a grueling chore.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">5. "I Can Do This All Day" (Pacing & Longevity)</h3>
                    <p>Steve’s catchphrase isn't about arrogance; it’s an ethos of steady endurance. Avoid burnout by adopting sustainable micro-habits that you can realistically maintain for the next decade. Real victory lies in continuous, unbroken streak building.</p>
                
    <p>There is another lesson in the way Steve approaches setbacks: he does not confuse a temporary limitation with a permanent identity. The people around him repeatedly judge what he cannot do, but he keeps his attention on the values he can practise right now. That distinction matters when building a routine. You may not be able to complete a long workout, study for three hours, or change every meal in one day. You can still take a short walk, review a few pages, or prepare one nourishing option. Small actions are not meaningless simply because they look ordinary.</p>
    <p>It is also important to remember that discipline should not become punishment. Steve's determination is inspiring, but a healthy routine needs rest, flexibility, and room for real life. Missing one day does not erase previous effort. The useful response is to begin again instead of turning one interruption into a reason to quit. Think of the serum as the dramatic part of the story, not the everyday plan. The everyday plan is the quiet decision to keep practising, make the next helpful choice, and build a life that can support you over time.</p>

                    <p class="lead text-lg text-white font-serif">You dropped $150,000 on an education you could have got for $1.50 in late fees at the public library. Will Hunting understood information access—but true retention requires vulnerability.</p>
                    <p>In <em>Good Will Hunting</em>, Matt Damon plays a janitor at MIT who can solve graduate-level Fourier transforms on a hallway chalkboard in minutes. Yet despite reading thousands of books, Will is emotionally trapped and incapable of applying knowledge to his own life choices. His journey provides the ultimate framework for how we absorb, retain, and synthesize knowledge in the digital age.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">1. Active Retrieval vs. Passive Consumption</h3>
                    <p>Will doesn't just read books; he deconstructs them, argues with them, and tests them against reality. Modern cognitive psychology highlights that re-reading notes or highlighting textbooks creates a false illusion of competence. True retention demands active recall—testing your memory without looking at the text and forcing your brain to reconstruct neural pathways.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">2. The "Feynman Technique" in a Boston Bar</h3>
                    <p>During the famous bar debate with an arrogant graduate student, Will quotes 50 years of economic history from memory to dismantle a regurgitated argument. He understands the core concepts so thoroughly that he can reframe them effortlessly. If you cannot explain a complex topic in simple terms to a friend, you haven't retained it yet; you've merely memorized words.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">3. Experiential Anchoring (The Park Bench Monologue)</h3>
                    <p>Robin Williams' character, Dr. Sean Maguire, delivers a masterclass on the limits of book smarts: <em>"If I ask you about art, you'd probably give me the skinny on every art book ever written... but I bet you can't tell me what it smells like in the Sistine Chapel."</em> Connect abstract concepts to emotional, real-world experiences to lock them into long-term memory banks.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">4. Breaking Through Cognitive Defense Mechanisms</h3>
                    <p>Will used obscure intellectual facts as armor to keep people at a distance. When studying complex subjects, we often collect bookmarks and saved articles to feel productive without doing the hard work of deep comprehension. True learning happens when you drop the armor and wrestle directly with difficult ideas.</p>
                
    <p>Another useful part of Will's story is the difference between being able to answer a question and being able to use what you know. A person may remember definitions perfectly but still struggle to recognize when an idea applies outside a classroom. To close that gap, try connecting every new concept to a concrete example. After reading a chapter, describe where the idea might appear in daily life, explain why it matters, and identify a situation in which it might not apply. This turns learning into a process of interpretation rather than a race to collect facts.</p>
    <p>Will also reminds us that intelligence is not the same as emotional maturity. His talent gives him opportunities, but it cannot make difficult decisions for him or automatically repair his relationships. In the same way, academic achievement does not remove the need for patience, curiosity, and honest self-reflection. A strong learner should be willing to say, “I do not understand this yet,” and ask for help without treating that admission as failure. Mentors, classmates, teachers, and friends can challenge our assumptions in ways that solitary reading cannot.</p>
    <p>A practical routine inspired by the film could be simple: study a small section, close the material, write down what you remember, and explain the main idea in your own words. Return to it later and test yourself again. When an answer is incomplete, use the gap to decide what to review next. The goal is not to imitate Will's extraordinary memory. It is to become more thoughtful about what you learn, how you apply it, and how willing you are to let new experiences change your understanding.</p>

                    <p>When preparing this indie short, my goal was to contrast the rapid, hyper-stimulating pacing of modern online video with the slow, deliberate pulse of daily life in Brunei Darussalam. We shot entirely in 2.39:1 CinemaScope aspect ratio on anamorphic prime lenses to give the everyday greenery, mangrove channels, and quiet urban corners an intentional, epic weight.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">Shot List & Creative Intent</h3>
                    <ul class="list-disc list-inside space-y-2 my-4 text-muted">
                        <li><strong class="text-white">Shot 1 (0:00 - 0:15):</strong> Morning fog lifting over Kampong Ayer. Static frame on tripod. No camera movement. Letting natural light do the acting as water taxis gently ripple the water.</li>
                        <li><strong class="text-white">Shot 2 (0:15 - 0:45):</strong> Close-up tracking shot of heavy tropical raindrops falling off palm leaves. Audio focused entirely on spatial ambient rain soundscapes without music overlay.</li>
                        <li><strong class="text-white">Shot 3 (0:45 - 1:15):</strong> Golden hour reflection off the golden domes of Omar Ali Saifuddien Mosque. Warm amber color grade to emphasize timeless tranquility.</li>
                        <li><strong class="text-white">Shot 4 (1:15 - 1:30):</strong> Fade to black with quiet ocean waves crashing along Muara Beach under overcast skies.</li>
                    </ul>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">The Philosophy of Negative Space (Ma)</h3>
                    <p>Japanese aesthetics speak of <em>ma</em>—the deliberate pause or empty space that gives shape to surrounding elements. Modern media suffocates viewers with non-stop cuts and loud soundtracks. By slowing down the frame rate and embracing ambient silence, the video invites the viewer to breathe, observe, and find clarity amid noisy daily schedules.</p>
                
    <p>The short's visual approach is also a reminder that a place does not need a dramatic event to be worth documenting. Familiar scenes can become meaningful when the camera gives them enough time. A water taxi crossing the river, rain collecting on a leaf, or a quiet street after a shower may seem unremarkable during a busy day. Framed carefully, these details become a record of atmosphere and everyday life. The intention is not to present Brunei as untouched or perfect, but to notice the textures and rhythms that are easy to overlook when we move through familiar surroundings.</p>
    <p>Sound plays an important role in creating that feeling. Instead of filling every moment with narration or a constant soundtrack, the edit allows natural audio to guide the viewer: water moving, rain falling, distant activity, and the hush between sounds. These details help establish a sense of place more honestly than a rapid sequence of captions could. They also encourage the audience to pay attention. A pause gives the viewer time to look at the frame, notice its smaller details, and decide what the scene means to them.</p>
    <p>For the creator, this approach requires restraint. It can be tempting to add more transitions, music, effects, and movement because those elements make a video feel busy. Here, simplicity is a deliberate choice rather than a lack of effort. Each shot needs a reason to remain on screen, and each cut should preserve the calm pace of the piece. The final result is an invitation to slow down and see the familiar with fresh eyes. Sometimes the most memorable image is not the biggest landmark, but a quiet moment that feels true to the place.</p>

                content: `
                    <p class="lead text-lg text-white font-serif">WALL-E spent 700 years compacting garbage on an abandoned Earth, while humans hovered in floating chairs sipping meals through straws. Pixar didn't just warn us about trash—they predicted digital paralysis.</p>
                    <p>Andrew Stanton’s masterpiece <em>WALL-E</em> remains one of cinema's sharpest critiques of consumerism and environmental neglect. But beneath the rusted robot romance lies a critical warning about how convenience can quietly erode our health, critical thinking, and connection to nature.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">1. The Danger of Frictionless Living</h3>
                    <p>On board the Axiom, every human need is met instantly by Buy n Large algorithms. Hover chairs move people automatically, screens hover inches from faces, and food is processed into uniform liquids. The result? Muscle atrophy, complete lack of physical orientation, and blindness to the person sitting right beside them. When we eliminate all physical and mental friction from life, we eliminate the very stimulus that keeps us resilient.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">2. Curating Beauty in the Trash (WALL-E's Collection)</h3>
                    <p>While humans with infinite resources consume mindlessly, WALL-E finds deep wonder in discarded objects—a Rubik's cube, a glowing lightbulb, an old VHS tape of <em>Hello, Dolly!</em>. Environmental stewardship and mental peace start with appreciating what already exists in our space rather than constantly chasing the next upgraded product.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">3. The Plant in the Boot (Micro-Restoration)</h3>
                    <p>Earth wasn't saved by a massive planetary engine; it was saved because one tiny robot protected one fragile green seedling inside a discarded leather boot. Global environmental challenges feel overwhelming, but systemic restoration always begins with localized micro-actions: planting a garden, reducing single-use plastics, and honoring nature.</p>
                
    <p>The film's contrast between the crowded, automated Axiom and the abandoned Earth makes its environmental message easy to understand. The problem is not technology by itself; it is the habit of using convenience without considering its consequences. A product can save time and still create waste. A screen can connect people and still distract them from the world around them. The film asks viewers to look beyond the immediate comfort of a purchase or service and consider the longer chain of materials, energy, habits, and disposal that follows.</p>

    <p>WALL-E's careful collection of objects offers a quieter alternative to constant replacement. Repairing something, reusing a container, borrowing an item, or choosing a product that lasts longer may seem like small decisions, but they change the relationship we have with our belongings. These actions are not a complete solution to large environmental problems, and individuals cannot carry the whole responsibility alone. Businesses, communities, and governments also shape the systems in which people make choices. Still, personal habits can support wider change and help us notice that a more meaningful life does not always require more things.</p>

                    <p>Sam Mendes' 2005 adaptation of Anthony Swofford's 2003 memoir follows a young Marine through the buildup to the Gulf War. Most of the film is spent on training, heat, boredom, and waiting for a fight that arrives late and ends quickly. Instead of battlefield heroics, it shows what happens to a person when an institution makes nearly every decision for them.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">1. Who Writes the Script for How You Feel?</h3>
                    <p>In one of the film's best-known scenes, the Marines gather to watch the helicopter attack from <em>Apocalypse Now</em> and cheer along with the music, even though many viewers read that sequence as a warning about war rather than a celebration of it. The moment shows how easily a group can absorb a ready-made reaction. Nobody in the room has to be ordered to feel that way; the mood simply spreads. Our own feeds work in a similar manner, handing us the right outrage, the right joke, or the right side before we have had time to ask what we actually think.</p>

                    <p>Swofford is trained as a sniper, yet his readiness counts for little because other people control when and whether anything happens. In one painful sequence, a sniper team that has waited for its chance is overruled when the mission is taken out of their hands. The point is not that structure and discipline are bad. Most communities, workplaces, and governments rely on them. The point is that handing over your judgment has a price, and it is worth knowing where your own responsibility begins and ends before you hand it over.</p>
                    <h3 class="text-xl font-bold font-serif text-white mt-6 mb-2">3. Reclaiming Your Own Story Afterwards</h3>

    <p>For everyday life, the lesson does not have to involve war at all. Any strong institution, whether a school, a company, a political movement, or a group chat, can shape how we think without ever announcing it. A useful habit is to pause before adopting a strong opinion and ask a few simple questions. Where did this view come from? Did I reach it by weighing evidence, or by watching what the people around me approved of? What would I think if nobody were watching? Writing the answers down can make the difference between reacting and deciding.</p>
    <p>Autonomy also does not mean rejecting every rule or distrusting every authority. It means keeping the ability to question, even when you choose to follow. Reading from more than one source, talking with people who see an issue differently, and making small decisions on purpose rather than by default all help keep that ability strong. When we do decide to commit to a group or a cause, we are better off doing so knowingly, with a clear idea of what we are agreeing to and what we are not.</p>

        // Newsletter Submission Handler via Formspree
        async function handleNewsletterSubmit(event, formId) {
            event.preventDefault();
            const form = document.getElementById(formId);
            const statusEl = document.getElementById(`${formId}-status`);
            const submitBtn = form.querySelector('button[type="submit"]');

            const formData = new FormData(form);
            
            // Disable button during send
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            
            statusEl.classList.remove('hidden', 'bg-emerald-500/10', 'text-emerald-400', 'bg-rose-500/10', 'text-rose-400');
            statusEl.classList.add('bg-brandBlue/10', 'text-brandBlue');
            statusEl.textContent = 'Sending...';

            try {
                const response = await fetch(FORMSPREE_URL, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json'
                    },
                    body: formData
                });

                if (response.ok) {
                    statusEl.className = 'mt-3 p-3 rounded-lg text-xs font-medium text-center bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                    statusEl.textContent = "You're on the list! 🎬";
                    form.reset();
                } else {
                    const data = await response.json();
                    throw new Error(data.error || 'Submission failed');

                statusEl.className = 'mt-3 p-3 rounded-lg text-xs font-medium text-center bg-rose-500/10 text-rose-400 border border-rose-500/20';
                statusEl.textContent = 'Oops! Something went wrong. Please try again.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

                            </thead>
                            <tbody class="divide-y divide-border/60 font-sans">
                                ${BLOG_ENTRIES.map(entry => `
                                    <tr onclick="navigateToEntry('${entry.id}')" class="hover:bg-panel-hover transition-colors cursor-pointer group">
                                        <td class="py-3 px-4 font-medium text-white group-hover:text-brandBlue">
                                            ${entry.filmTitle} <span class="text-xs text-muted">(${entry.year})</span>
                                        </td>
                                        <td class="py-3 px-4 text-text font-serif">
                                            ${entry.title}
                                        </td>
                                        <td class="py-3 px-4 hidden md:table-cell">
                                            ${renderStars(entry.rating)}
                                        </td>
                                        <td class="py-3 px-4 text-right font-mono text-xs text-brandBlue">
                                            ${entry.runtime}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // Render Lists Page View
        function renderLists() {
            return `
                <div class="max-w-4xl mx-auto space-y-8">
                    <div class="border-b border-border pb-4">
                        <h1 class="text-3xl font-serif font-bold text-white">Curated Lists</h1>
                        <p class="text-xs text-muted font-mono mt-1">Categorized film collections for personal development.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-panel border border-border rounded-xl p-6 space-y-3 hover:border-brandBlue transition-colors">
                            <div class="text-xs font-mono text-brandBlue uppercase tracking-wider font-bold">List #01</div>
                            <h2 class="text-xl font-serif font-bold text-white">Cinema for Personal Productivity</h2>
                            <p class="text-xs text-muted">Films that inspire daily habit building, relentless work ethic, and deep focus.</p>
                            <div class="flex -space-x-2 pt-2">
                                <div class="w-8 h-12 bg-blue-900 border border-bg rounded"></div>
                                <div class="w-8 h-12 bg-amber-900 border border-bg rounded"></div>
                            </div>
                        </div>

                        <div class="bg-panel border border-border rounded-xl p-6 space-y-3 hover:border-brandPink transition-colors">
                            <div class="text-xs font-mono text-brandPink uppercase tracking-wider font-bold">List #02</div>
                            <h2 class="text-xl font-serif font-bold text-white">Critical Thinking & Autonomy</h2>
                            <p class="text-xs text-muted">Stories that challenge public consensus, dogma, and mental passive consumption.</p>
                            <div class="flex -space-x-2 pt-2">
                                <div class="w-8 h-12 bg-red-950 border border-bg rounded"></div>
                                <div class="w-8 h-12 bg-stone-900 border border-bg rounded"></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render Individual Film Entry View
        function renderFilmEntry(entryId) {
            const index = BLOG_ENTRIES.findIndex(e => e.id === entryId);
            if (index === -1) return renderHome();

            const entry = BLOG_ENTRIES[index];
            const prevEntry = BLOG_ENTRIES[(index - 1 + BLOG_ENTRIES.length) % BLOG_ENTRIES.length];
            const nextEntry = BLOG_ENTRIES[(index + 1) % BLOG_ENTRIES.length];

            return `
                <article class="max-w-4xl mx-auto space-y-10">
                    <!-- ENTRY HEADER / POSTER & META -->
                    <div class="flex flex-col md:flex-row gap-8 items-start border-b border-border pb-8">
                        <!-- Poster -->
                        <div class="w-48 md:w-56 aspect-[2/3] rounded-lg overflow-hidden bg-panel border border-border shadow-xl flex-shrink-0 relative mx-auto md:mx-0">
                            ${entry.posterImg ? `<img src="${entry.posterImg}" alt="${entry.filmTitle}" class="w-full h-full object-cover relative z-10" onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');" />` : ''}
                            <div class="${entry.posterImg ? 'hidden' : ''} absolute inset-0 z-0">
                                ${entry.svgFallback}
                            </div>
                        </div>

                        <!-- Header Information -->
                        <div class="space-y-4 flex-grow text-center md:text-left">
                            <div class="flex flex-wrap items-center justify-center md:justify-start gap-3 text-xs font-mono text-muted">
                                <span class="text-brandBlue font-semibold uppercase tracking-wider">${entry.category}</span>
                                <span>&bull;</span>
                                <span>${entry.runtime}</span>
                            </div>

                            <h1 class="text-3xl md:text-5xl font-extrabold font-serif text-white tracking-tight leading-tight">
                                ${entry.title}
                            </h1>

                            <div class="text-base text-text font-serif italic">
                                Film Focus: <span class="text-white font-semibold">${entry.filmTitle}</span> (${entry.year})
                            </div>

                            <div class="flex items-center justify-center md:justify-start space-x-4 py-2 border-y border-border/60">
                                <div>${renderStars(entry.rating)}</div>
                                <span>&bull;</span>
                                ${renderActionIcons(entry)}
                            </div>

                            <!-- Tags -->
                            <div class="flex flex-wrap justify-center md:justify-start gap-2 pt-1">
                                ${entry.tags.map(tag => `<span class="text-[11px] font-mono bg-panel border border-border px-2.5 py-1 rounded-full text-muted">#${tag}</span>`).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- SPOILER WARNING BANNER -->
                    <div class="bg-panel/80 border border-brandAmber/30 rounded-xl p-5 space-y-2">
                        <div class="flex items-center space-x-2 text-xs font-mono text-brandAmber uppercase font-bold tracking-wider">
                            <svg viewBox="0 0 24 24" fill="currentColor" style="display:inline-block;width:1.3em;height:1.3em;vertical-align:-0.28em" aria-hidden="true"><path fill-rule="evenodd" d="M12 2L1 21h22zM11 9h2v6h-2zm0 8h2v2h-2z"/></svg>
                            <span>The Core Spoiler & Life Lesson (Click to reveal)</span>
                        </div>
                        <div onclick="toggleSpoiler(this)" class="spoiler-text bg-bg p-4 rounded-lg border border-border text-sm md:text-base font-serif text-white leading-relaxed">
                            "${entry.spoiler}"
                        </div>
                    </div>

                    <!-- 2.39:1 CINEMASCOPE VIDEO FRAME (IF VLOG) -->
                    ${entry.isVideo ? `
                        <div class="space-y-3">
                            <div class="flex items-center justify-between text-xs font-mono text-muted">
                                <span class="text-brandPink font-bold uppercase"><svg class="mr-1" viewBox="0 0 24 24" fill="currentColor" style="display:inline-block;width:1.3em;height:1.3em;vertical-align:-0.28em" aria-hidden="true"><path d="M3 6h12a2 2 0 012 2v8a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2zm15 4l5-3v10l-5-3z"/></svg> CinemaScope 2.39:1 Frame</span>
                                <span>90 Sec Short</span>
                            </div>
                            <div class="w-full relative rounded-xl overflow-hidden bg-black border border-border shadow-2xl" style="padding-top: 41.84%;">
                                <iframe src="${entry.videoEmbedUrl}" title="Life in Brunei" class="absolute top-0 left-0 w-full h-full border-0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                            </div>
                        </div>
                    ` : ''}

                    <!-- ARTICLE CONTENT BODY -->
                    <div class="prose prose-invert max-w-none text-text space-y-5 leading-relaxed font-sans text-base">
                        ${entry.content}
                    </div>

                    <!-- ENTRY INFOGRAPHIC (optional) -->
                    ${entry.infographic || ''}

                    <!-- MOVIE FUN FACT BOX -->
                    ${entry.funFact ? `
                        <div class="bg-panel border border-brandBlue/30 rounded-xl p-5 flex items-start space-x-4 my-6">
                            <div class="text-brandBlue text-2xl pt-1">
                                <svg viewBox="0 0 24 24" fill="currentColor" style="display:inline-block;width:1.3em;height:1.3em;vertical-align:-0.28em" aria-hidden="true"><path d="M3 10h18v9a2 2 0 01-2 2H5a2 2 0 01-2-2zM3.2 5.6l15.6-3.1.7 3.4L3.9 9z"/></svg>
                            </div>
                            <div class="space-y-1">
                                <h4 class="text-xs font-mono uppercase text-brandBlue font-bold tracking-wider">Film Trivia & Fun Fact</h4>
                                <p class="text-xs md:text-sm text-text font-sans leading-relaxed">${entry.funFact}</p>
                            </div>
                        </div>
                    ` : ''}

                    <!-- PREVIOUS / NEXT ENTRY NAVIGATION -->
                    <div class="flex items-center justify-between pt-8 border-t border-border text-xs font-mono">
                        <button onclick="navigateToEntry('${prevEntry.id}')" class="flex items-center space-x-2 text-muted hover:text-brandBlue transition-colors group text-left">
                            <svg class="transition-transform group-hover:-translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;width:1.3em;height:1.3em;vertical-align:-0.28em" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
                            <div>
                                <div class="text-[10px] uppercase text-muted">Previous</div>
                                <div class="text-white font-serif font-bold line-clamp-1">${prevEntry.filmTitle}</div>
                            </div>
                        </button>
                        
                        <button onclick="navigateToEntry('${nextEntry.id}')" class="flex items-center space-x-2 text-muted hover:text-brandBlue transition-colors group text-right">
                            <div>
                                <div class="text-[10px] uppercase text-muted">Next</div>
                                <div class="text-white font-serif font-bold line-clamp-1">${nextEntry.filmTitle}</div>
                            </div>
                            <svg class="transition-transform group-hover:translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;width:1.3em;height:1.3em;vertical-align:-0.28em" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                        </button>
                    </div>

                    <!-- NEWSLETTER SIGNUP (ENTRY BOTTOM) -->
                    <div class="pt-8 border-t border-border">
                        ${renderCinemaTicket(`entry-bottom-newsletter-${entry.id}`)}
                    </div>
                </article>
            `;
        }

        /**
         * ROUTER CONTROLLER
         */
        function router() {
            const app = document.getElementById('app-content');
            const hash = window.location.hash || '#home';

            // Scroll to top on navigation
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (hash === '#home' || hash === '') {
                app.innerHTML = renderHome();
            } else if (hash === '#diary') {
                app.innerHTML = renderDiary();
            } else if (hash === '#lists') {
                app.innerHTML = renderLists();
            } else if (hash.startsWith('#film-')) {
                const entryId = hash.replace('#', '');
                app.innerHTML = renderFilmEntry(entryId);
            } else {
                app.innerHTML = renderHome();
            }
            fitInfographics();
        }

        // Scale fixed-size infographic posters to fit their frame
        function fitInfographics() {
            document.querySelectorAll('.infographic-frame').forEach(frame => {
                const poster = frame.querySelector('.infographic-poster');
                if (poster && frame.clientWidth) poster.style.transform = 'scale(' + (frame.clientWidth / 1123) + ')';
            });
        }
        window.addEventListener('resize', fitInfographics);

        // Initialize App
        window.addEventListener('hashchange', router);
        window.addEventListener('load', () => {
            document.getElementById('current-year').textContent = new Date().getFullYear();
            router();
        });
    </script>
</body>
</html>
